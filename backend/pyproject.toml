[project]
name = "pawpilot-backend"
version = "0.0.0"
description = "PawPilot backend — FastAPI service."
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "fastapi-users[sqlalchemy]>=14.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "pyjwt>=2.10",
    "python-dateutil>=2.9.0.post0",
    # RAG (spec 009) — request-path runtime deps only.
    "openai>=2.0,<3",
    "qdrant-client>=1.12,<2",
    "langchain-text-splitters>=1.1,<2",
    "langsmith>=0.8,<0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "psycopg2-binary>=2.9",
    "types-python-dateutil>=2.9.0.20260518",
]
# Corpus ingest (offline script only — never in the serving image).
rag = [
    "pypdf>=5",
]
# RAGAS eval harness (offline only). Pinned to the AIE10 course fork: the
# `ragas.metrics.collections` + `generate_with_chunks` API only exists on this
# commit, and the fork imports a legacy module removed in langchain-community 0.4.
evals = [
    "ragas @ git+https://github.com/vibrantlabsai/ragas.git@298b68274234c060deacab3cf5fb52aa3a20e885",
    "langchain-community==0.3.31",
    "instructor>=1.15,<2",
    "datasets>=3",
    "openevals>=0.2,<0.3",
    # Required by the RAGAS fork's testset relationship builders (string-distance
    # overlap), but not declared as a dependency by the fork itself.
    "rapidfuzz>=3,<4",
]

[tool.uv]
# `rag` is synced by default so `make check` can import the ingest helpers;
# `evals` (the heavy pinned fork) stays opt-in via `uv sync --group evals`.
default-groups = ["dev", "rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
# B008: `Depends(...)` in function defaults is the idiomatic FastAPI pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
