# Railway service config for the PawPilot backend.
# Set this service's Root Directory to `backend/` in the Railway dashboard so
# this file and the Dockerfile are picked up.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Apply migrations, then serve. Railway provides $PORT.
startCommand = "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
