# Railway service config for the PawPilot backend.
# Set this service's Root Directory to `backend/` in the Railway dashboard so
# this file and the Dockerfile are picked up.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Startup is the image entrypoint (entrypoint.sh): it prepares MEDIA_ROOT,
# drops to the non-root pawpilot user, applies migrations, then serves on
# $PORT. No startCommand override, so that single entrypoint stays in charge.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
